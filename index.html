<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythmic Gym</title>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap)" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #050508; 
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Quando lo slot Ã¨ in focus durante il countdown */
.slot.countdown-focus {
    position: relative;
    z-index: 15; /* Deve essere maggiore del z-index di .countdown-overlay (10) */
    border-color: #00d2ff;
    box-shadow: 0 0 20px #00d2ff;
    background: #07070c;
}

        .app-container {
            width: 100%;
            max-width: 430px; 
            height: 100%;
            max-height: 920px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        header { text-align: center; margin-bottom: 2px; }
        .top-header {
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            align-items: center;
        }
        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 900;
            font-size: 1.9rem; 
            background: linear-gradient(to right, #00d2ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.5));
            letter-spacing: 3px;
        }

        .credits {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #ff007f;
            letter-spacing: 2px;
            margin-top: 1px;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
            font-weight: 600;
        }

        .icon-menu-button {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            padding: 0;
            background: #090911;
            border: 1px solid #7928ca;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.18);
        }
        .icon-menu-button span {
            width: 18px;
            height: 2px;
            background: #00d2ff;
            box-shadow: 0 0 6px rgba(0, 210, 255, 0.8);
        }

        .app-menu {
            position: fixed;
            top: 52px;
            right: 12px;
            z-index: 35;
            display: none;
            width: min(320px, calc(100vw - 24px));
            background: rgba(9, 9, 17, 0.98);
            border: 1px solid #7928ca;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 18px rgba(255, 0, 127, 0.25);
            padding: 10px;
        }
        .app-menu.show { display: block; }
        .menu-action {
            width: 100%;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #7928ca, #0070f3);
            color: #fff;
        }
        .sound-settings {
            border-top: 1px solid rgba(121, 40, 202, 0.45);
            margin-top: 8px;
            padding-top: 8px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .sound-settings select {
            color: #ff007f;
        }
        .sound-settings select:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(121, 40, 202, 0.35);
            color: rgba(255, 255, 255, 0.45);
        }

        .mode-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 920px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .mode-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mode-header-row h1 { flex: 1; font-size: 1.35rem; text-align: center; }
        .back-mode-button {
            flex: 0 0 auto;
            padding: 8px 10px;
            background: #090911;
            color: #00d2ff;
            border: 1px solid #7928ca;
            font-size: 0.68rem;
        }

        .metronome-stage {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .pulse-wrap {
            width: min(350px, 86vw);
            aspect-ratio: 1 / 1;
            position: relative;
            display: grid;
            place-items: center;
        }
        .pulse-wave {
            position: absolute;
            width: 58%;
            height: 58%;
            border: 2px solid rgba(0, 210, 255, 0.6);
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
        }
        .pulse-wrap.pulse .pulse-wave.one { animation: pulseWave 0.7s ease-out; }
        .pulse-wrap.pulse .pulse-wave.two { animation: pulseWave 0.7s ease-out 0.08s; }
        .pulse-circle {
            width: 68%;
            height: 68%;
            border-radius: 50%;
            border: 3px solid #00d2ff;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.32), rgba(0, 112, 243, 0.18) 58%, rgba(5, 5, 8, 0.95));
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.55), inset 0 0 24px rgba(255, 0, 127, 0.4);
            display: grid;
            place-items: center;
            transition: transform 0.08s ease, border-color 0.08s ease;
        }
        .pulse-wrap.pulse .pulse-circle {
            transform: scale(1.08);
            border-color: #ff007f;
        }
        .metronome-bpm-readout {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 14px rgba(255, 0, 127, 0.75);
        }
        .metronome-controls {
            width: 100%;
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            gap: 8px;
            align-items: center;
        }
        .metronome-controls button {
            min-width: 44px;
            height: 44px;
            padding: 0;
            background: #090911;
            color: #00d2ff;
            border: 1px solid #7928ca;
            font-size: 1.25rem;
        }
        #metronomeBpmRange {
            accent-color: #ff007f;
        }
        #btnMetronomePlay {
            flex: 0 0 auto;
            width: 58px;
            height: 58px;
            padding: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #0070f3, #00d2ff);
            color: white;
            font-size: 0;
            position: relative;
        }
        #btnMetronomePlay::before {
            content: "";
            display: block;
            width: 0;
            height: 0;
            margin: auto;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid #fff;
            transform: translateX(2px);
        }
        #btnMetronomePlay.playing {
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        #btnMetronomePlay.playing::before {
            width: 18px;
            height: 18px;
            border: none;
            background: #fff;
            transform: none;
        }

        @keyframes pulseWave {
            0% { opacity: 0.9; transform: scale(0.72); }
            100% { opacity: 0; transform: scale(1.75); }
        }

        .control-panel {
            background: rgba(15, 15, 25, 0.85);
            border: 2px solid rgba(121, 40, 202, 0.3);
            border-radius: 12px;
            padding: 10px; 
            display: flex;
            flex-direction: column;
            gap: 8px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .flex-1 { flex: 1; }

        label { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem; 
            font-weight: 600;
            text-transform: uppercase; 
            color: #00d2ff; 
            letter-spacing: 1px; 
            display: block; 
            margin-bottom: 3px;
        }
        
        select, input[type="range"] {
            width: 100%;
            background: #090911;
            border: 1px solid #7928ca;
            color: white;
            padding: 6px 10px; 
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .bpm-display {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ff007f;
            text-shadow: 0 0 6px rgba(255, 0, 127, 0.6);
            min-width: 55px;
            text-align: right;
        }

        /* Toggle Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #090911; border: 1px solid #7928ca; border-radius: 22px;
            transition: .2s;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; border-radius: 50%; transition: .2s;
        }
        input:checked + .slider { background-color: #ff007f; border-color: #ff007f; }
        input:checked + .slider:before { transform: translateX(16px); }

        button {
            flex: 1;
            padding: 10px; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.85rem; 
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #btnRandomize {
            background: linear-gradient(135deg, #7928ca, #ff007f);
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }
        #btnPlay {
            background: linear-gradient(135deg, #0070f3, #00d2ff);
            color: white;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        #btnPlay.playing { background: #ff3333; box-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
        button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

        .grid-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0; 
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%; 
            max-height: calc(100vw - 32px); 
            aspect-ratio: 1 / 1; 
        }

        .slot {
            background: #07070c;
            border: 3.5px solid #0070f3; 
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0, 112, 243, 0.4), inset 0 0 12px rgba(0, 112, 243, 0.35);
            transition: background-color 0.08s ease, border-color 0.08s ease;
            padding: 6px; 
        }

        .slot-label {
            position: absolute;
            bottom: 2px;
            font-size: 0.6rem;
            font-family: 'Orbitron', sans-serif;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
        
        /* Modalita diagnostica: le lettere compaiono solo se SHOW_FIGURATION_LETTERS e true nel codice JS */
        .slot-label {
            position: absolute;
            bottom: 2px;
            font-size: 0.6rem;
            font-family: 'Orbitron', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 0 4px;
            border-radius: 3px;
        }

        /* Classe aggiunta al body quando la modalita diagnostica e attiva */
        body.dev-mode .slot-label {
            display: block;
        }
        
        .slot svg .draw-fill { fill: #ffffff; }
        .slot svg .draw-stroke { stroke: #ffffff; fill: none; }

        .slot.extended {
            background: #030305;
            border: 1px dashed rgba(0, 112, 243, 0.15);
            box-shadow: none;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .slot.animate-pop svg {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2) both;
        }

        .slot.active {
            background-color: rgba(121, 40, 202, 0.4);
            border-color: #ff007f;
            box-shadow: 0 0 18px #ff007f, inset 0 0 12px #ff007f;
        }
        .slot.active svg {
            filter: drop-shadow(0 0 6px rgba(255, 0, 127, 0.9));
        }
        .slot.active svg .draw-fill { fill: #ff007f; }
        .slot.active svg .draw-stroke { stroke: #ff007f; }

        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .countdown-overlay.show { opacity: 1; }
        .countdown-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 9rem;
            font-weight: 900;
            color: #ff007f;
            text-shadow: 0 0 40px #ff007f;
            transform: scale(0.4);
            transition: transform 0.1s ease;
        }
        .countdown-overlay.show .countdown-text { transform: scale(1); }
        .hidden { display: none !important; }

        .slot-menu {
            position: fixed;
            z-index: 30;
            display: none;
            min-width: 132px;
            background: rgba(9, 9, 17, 0.98);
            border: 1px solid #7928ca;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(255, 0, 127, 0.25);
            padding: 6px;
        }
        .slot-menu.show { display: block; }
        .slot-menu button {
            width: 100%;
            padding: 9px 12px;
            background: linear-gradient(135deg, #7928ca, #ff007f);
            color: #fff;
            font-size: 0.72rem;
            border-radius: 6px;
        }

        .tutorial-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 920px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .tutorial-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tutorial-header-row h1 { flex: 1; font-size: 1.35rem; text-align: center; }
        #btnBackTutorial {
            flex: 0 0 auto;
            padding: 8px 10px;
            background: #090911;
            color: #00d2ff;
            border: 1px solid #7928ca;
            font-size: 0.68rem;
        }
        .tutorial-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tutorial-top {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .tutorial-note-box,
        .tutorial-text-box {
            background: #07070c;
            border: 3.5px solid #0070f3;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0, 112, 243, 0.4), inset 0 0 12px rgba(0, 112, 243, 0.35);
            min-height: 0;
        }
        .tutorial-note-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .tutorial-note-box svg {
            width: 92%;
            height: 92%;
        }
        .tutorial-note-box svg .draw-fill,
        .tutorial-grid .slot svg .draw-fill { fill: #ffffff; }
        .tutorial-note-box svg .draw-stroke,
        .tutorial-grid .slot svg .draw-stroke { stroke: #ffffff; fill: none; }
        .tutorial-text-box {
            padding: 12px;
            overflow: auto;
            font-size: 0.96rem;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.88);
        }
        .tutorial-text-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            color: #00d2ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .tutorial-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
        }
        .tutorial-grid .slot { cursor: pointer; }
        .tutorial-grid .slot.empty::after {
            content: "+";
            font-family: 'Orbitron', sans-serif;
            color: rgba(255, 255, 255, 0.18);
            font-size: 1.8rem;
        }
        .tutorial-controls { margin-top: 0; }
        #btnTutorialPlay {
            background: linear-gradient(135deg, #0070f3, #00d2ff);
            color: white;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        #btnTutorialPlay.playing { background: #ff3333; box-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
    </style>
</head>
<body>

    <div id="mainContainer" class="app-container">
        <header>
            <div class="top-header">
                <div></div>
                <div>
                    <h1>RHYTHMIC GYM</h1>
                    <div class="credits">By Jordu</div>
                </div>
                <button id="btnAppMenu" class="icon-menu-button" type="button" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <div class="control-panel">
            <div class="row">
                <div class="flex-1">
                    <label for="difficulty">Difficolta' / Argomento</label>
                    <select id="difficulty"></select>
                </div>
    <div style="display:flex; flex-direction:column; align-items:center;">
    <label for="autoRandomToggle" style="margin-bottom:6px">AutoRandom</label>
    <label class="switch">
        <input type="checkbox" id="autoRandomToggle">
        <span class="slider"></span>
    </label>
</div>
                <!-- Toggle per il playback del ritmo -->
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <label for="playbackToggle" style="margin-bottom:6px">Playback</label>
                    <label class="switch">
                        <input type="checkbox" id="playbackToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="row">
                <div class="flex-1">
                    <label for="bpm">Metronomo (BPM)</label>
                    <input type="range" id="bpm" value="100" min="40" max="220">
                </div>
                <div class="bpm-display"><span id="bpmValue">100</span> <span style="font-size:0.6rem">BPM</span></div>
            </div>
            <div class="row">
                <button id="btnRandomize">Randomize</button>
                <button id="btnPlay">Play</button>
            </div>
        </div>

        <div class="grid-wrapper">
            <div id="grid" class="grid"></div>
        </div>

        <div id="countdownOverlay" class="countdown-overlay">
            <div id="countdownText" class="countdown-text">1</div>
        </div>
    </div>

    <div id="appMenu" class="app-menu">
        <button id="btnOpenMetronome" class="menu-action" type="button">Metronomo</button>
        <div class="sound-settings">
            <div>
                <label for="readingSoundSelect">Suono</label>
                <select id="readingSoundSelect">
                    <option value="kick">Cassa</option>
                    <option value="snare" selected>Rullante</option>
                    <option value="hihat">Hi-hat</option>
                </select>
            </div>
        </div>
    </div>

    <div id="metronomeContainer" class="mode-container hidden">
        <div class="mode-header-row">
            <button id="btnBackMetronome" class="back-mode-button" type="button">Indietro</button>
            <h1>METRONOMO</h1>
        </div>
        <div class="metronome-stage">
            <div id="metronomePulse" class="pulse-wrap">
                <div class="pulse-wave one"></div>
                <div class="pulse-wave two"></div>
                <div class="pulse-circle">
                    <div><span id="metronomeBpmReadout" class="metronome-bpm-readout">100</span></div>
                </div>
            </div>
            <div class="metronome-controls">
                <button id="btnMetroMinus" type="button">-</button>
                <input id="metronomeBpmRange" type="range" min="20" max="350" value="100">
                <button id="btnMetroPlus" type="button">+</button>
            </div>
            <button id="btnMetronomePlay" type="button">Play</button>
        </div>
    </div>

    <div id="slotMenu" class="slot-menu">
        <button id="btnOpenTutorial" type="button">Tutorial</button>
    </div>

    <div id="tutorialContainer" class="tutorial-container hidden">
        <div class="tutorial-header-row">
            <button id="btnBackTutorial" type="button">Indietro</button>
            <h1>TUTORIAL</h1>
        </div>

        <div class="tutorial-panel">
            <div class="tutorial-top">
                <div id="tutorialSelectedNote" class="tutorial-note-box"></div>
                <div id="tutorialText" class="tutorial-text-box">
                    <h2>Spiegazione</h2>
                    <!-- SCRIVI QUI IL TESTO DEL TUTORIAL: puoi sostituire questo paragrafo con la spiegazione della figurazione selezionata. -->
                    <p>Scrivi qui la spiegazione della figurazione selezionata.</p>
                </div>
            </div>

            <div id="tutorialGrid" class="tutorial-grid"></div>
        </div>

        <div class="control-panel tutorial-controls">
            <div class="row">
                <button id="btnTutorialPlay" type="button">Play</button>
            </div>
        </div>

        <div id="tutorialCountdownOverlay" class="countdown-overlay">
            <div id="tutorialCountdownText" class="countdown-text">1</div>
        </div>
    </div>

    <script>
        const metronomeSound = new Audio('click.mp3'); 
        const rhythmSound = new Audio('snare.mp3');
        const kickSound = new Audio('kick.mp3');
        const hihatSound = new Audio('hihat.mp3');
        const clapSound = new Audio ('clap.mp3');
        const stompSound = new Audio ('stomp.mp3');
        let readingSoundTarget = 'snare';
        
        function playClickSound() {
            metronomeSound.currentTime = 0;
            metronomeSound.play().catch(() => {});
        }

        function playRhythmSound() {
            const source = readingSoundTarget === 'kick' ? kickSound : readingSoundTarget === 'hihat' ? hihatSound : rhythmSound;
            const clone = source.cloneNode();
            clone.play().catch(() => {});
        }

        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            for (let i = 0; i < data.length; i++) {

                startMetronomeMode();

        }

        function pulseMetronome() {
            playClickSound();
            metronomePulse.classList.remove('pulse');
            void metronomePulse.offsetWidth;
            metronomePulse.classList.add('pulse');
        }

        function startMetronomeMode() {
            warmUpAudio();
            isMetronomePlaying = true;
            btnMetronomePlay.textContent = 'Stop';
            btnMetronomePlay.classList.add('playing');
            pulseMetronome();
            const msPerBeat = (60 / metronomeBpm) * 1000;
            metronomeInterval = setInterval(pulseMetronome, msPerBeat);
        }

        function stopMetronomeMode() {
            isMetronomePlaying = false;
            clearInterval(metronomeInterval);
            metronomeInterval = null;
            btnMetronomePlay.textContent = 'Play';
            btnMetronomePlay.classList.remove('playing');
            metronomePulse.classList.remove('pulse');
        }

        function applyFigurationKey(slot, key) {
            slot.setAttribute('data-type', key);

            let label = slot.querySelector('.slot-label');
            if (!label) {
                label = document.createElement('div');
                label.className = 'slot-label';
                slot.appendChild(label);
            }

            label.textContent = key;
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const slot = document.createElement('div');
                slot.classList.add('slot');
                slot.id = `slot-${i}`;
                slot.addEventListener('click', (event) => showSlotMenu(event, i));
                gridContainer.appendChild(slot);
            }
        }

        function initTutorialGrid() {
            tutorialGrid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.classList.add('slot', 'empty');
                slot.id = `tutorial-slot-${i}`;
                slot.addEventListener('click', () => toggleTutorialSlot(i));
                tutorialGrid.appendChild(slot);
            }
        }
        function getRandomKey(levelData) {
            const currentPool = levelData.current;
            const pastPool = levelData.past;
            
            if (pastPool.length === 0) {
                return currentPool[Math.floor(Math.random() * currentPool.length)];
            }
            
            if (Math.random() < 0.33) {
                return currentPool[Math.floor(Math.random() * currentPool.length)];
            } else {
                return pastPool[Math.floor(Math.random() * pastPool.length)];
            }
        }

        function getFigurationSlots(key) {
            if (key === 'U' || key === 'V') return 4;
            if (key === 'AA') return 3;
            if (key === 'W' || key === 'X') return 2;
            return 1;
        }

        function canPlaceInMeasure(key, index) {
            const position = index % 4;
            return position + getFigurationSlots(key) <= 4;
        }

        function canPlaceInRange(key, index, end) {
            return canPlaceInMeasure(key, index) && index + getFigurationSlots(key) <= end;
        }

        function addExtendedSlots(index, key, end) {
            const slots = getFigurationSlots(key);
            for (let next = 1; next < slots; next++) {
                if (index + next < end) {
                    document.getElementById(`slot-${index + next}`).classList.add('extended');
                }
            }
            return slots;
        }

function randomizeGrid() {
    const currentLevel = difficultySelect.value;
    const levelData = levels[currentLevel];
    
    // Pulizia griglia
   for (let i = 0; i < 16; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.className = 'slot'; 
        slot.innerHTML = '';
        slot.removeAttribute('data-type');
    }

    let i = 0;
    while (i < 16) {
        const slot = document.getElementById(`slot-${i}`);
        if (slot.classList.contains('extended')) { i++; continue; }

        let key;
        let attempt = 0;
        do {
            key = getRandomKey(levelData);
            attempt++;
            if (attempt > 50) { key = 'A'; break; }
        } while (!canPlaceInRange(key, i, 16));

        slot.insertAdjacentHTML('beforeend', figurations[key]);
        applyFigurationKey(slot, key);
        
        slot.classList.add('animate-pop');

        i += addExtendedSlots(i, key, 16);
    }
}
function randomizeRange(start, end) {
    const currentLevel = difficultySelect.value;
    const levelData = levels[currentLevel];
    
    // Pulisce e resetta solo gli slot richiesti
    for (let i = start; i < end; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.className = 'slot'; // Reset classi (rimuove active, extended, ecc)
        slot.innerHTML = '<div class="slot-label"></div>'; 
        slot.removeAttribute('data-type');
    }

    // Riempie il range
    let i = start;
    while (i < end) {
        const slot = document.getElementById(`slot-${i}`);
        if (slot.classList.contains('extended')) { i++; continue; }

        let key;
        let attempt = 0;

        do {
            key = getRandomKey(levelData);
            attempt++;
            if (attempt > 50) { key = 'A'; break; }
        } while (!canPlaceInRange(key, i, end));

        slot.insertAdjacentHTML('beforeend', figurations[key]);
        applyFigurationKey(slot, key);
        
        i += addExtendedSlots(i, key, end);
    }
}
        function getTutorialKeyFromSlot(index) {
            const slot = document.getElementById(`slot-${index}`);
            const directKey = slot.getAttribute('data-type');
            if (directKey) return directKey;

            for (let previous = index - 1; previous >= Math.max(0, index - 3); previous--) {
                const previousSlot = document.getElementById(`slot-${previous}`);
                const previousKey = previousSlot.getAttribute('data-type');
                if (!previousKey) continue;

                const distance = index - previous;
                if (distance < getFigurationSlots(previousKey)) return previousKey;
            }

            return null;
        }

        function showSlotMenu(event, index) {
            if (isPlaying || isTutorialPlaying) return;

            const key = getTutorialKeyFromSlot(index);
            if (!key) return;

            selectedTutorialKey = key;
            slotMenu.style.left = `${Math.min(event.clientX, window.innerWidth - 148)}px`;
            slotMenu.style.top = `${Math.min(event.clientY, window.innerHeight - 52)}px`;
            slotMenu.classList.add('show');
            event.stopPropagation();
        }

        function hideSlotMenu() {
            slotMenu.classList.remove('show');
        }

        function getTutorialText(key) {
            const content = tutorialContents[key] || {
                name: "Figurazione",
                text: "<p>Scrivi qui la spiegazione della figurazione selezionata.</p>"
            };

            return `
                <h2>${content.name}</h2>
                ${content.text}
            `;
        }

        function openTutorial(key) {
            if (!key) return;
            selectedTutorialKey = key;
            hideSlotMenu();
            if (isPlaying) stopPlayback();

            tutorialSelectedNote.innerHTML = figurations[key];
            tutorialText.innerHTML = getTutorialText(key);

            for (let i = 0; i < 8; i++) {
                clearTutorialSlot(i);
            }

            mainContainer.classList.add('hidden');
            tutorialContainer.classList.remove('hidden');
        }

        function closeTutorial() {
            stopTutorialPlayback();
            tutorialContainer.classList.add('hidden');
            mainContainer.classList.remove('hidden');
        }

        function clearTutorialSlot(index) {
            const slot = document.getElementById(`tutorial-slot-${index}`);
            slot.className = 'slot empty';
            slot.innerHTML = '';
            slot.removeAttribute('data-type');
            slot.removeAttribute('data-extended-from');
        }

        function getTutorialMainIndex(index) {
            const slot = document.getElementById(`tutorial-slot-${index}`);
            if (slot.getAttribute('data-type')) return index;

            const extendedFrom = slot.getAttribute('data-extended-from');
            if (extendedFrom !== null) return parseInt(extendedFrom, 10);

            return null;
        }

        function canPlaceTutorialKey(index, key) {
            const slots = getFigurationSlots(key);
            const rowPosition = index % 4;

            if (rowPosition + slots > 4 || index + slots > 8) return false;

            for (let offset = 0; offset < slots; offset++) {
                const slot = document.getElementById(`tutorial-slot-${index + offset}`);
                if (slot.getAttribute('data-type') || slot.getAttribute('data-extended-from')) return false;
            }

            return true;
        }

        function clearTutorialGroup(index) {
            const mainIndex = getTutorialMainIndex(index);
            if (mainIndex === null) return;

            const mainSlot = document.getElementById(`tutorial-slot-${mainIndex}`);
            const key = mainSlot.getAttribute('data-type');
            const slots = getFigurationSlots(key);

            for (let offset = 0; offset < slots && mainIndex + offset < 8; offset++) {
                clearTutorialSlot(mainIndex + offset);
            }
        }

        function fillTutorialSlot(index) {
            if (!canPlaceTutorialKey(index, selectedTutorialKey)) return;

            const slot = document.getElementById(`tutorial-slot-${index}`);
            slot.className = 'slot animate-pop';
            slot.innerHTML = figurations[selectedTutorialKey];
            applyFigurationKey(slot, selectedTutorialKey);

            const slots = getFigurationSlots(selectedTutorialKey);
            for (let offset = 1; offset < slots; offset++) {
                const extendedSlot = document.getElementById(`tutorial-slot-${index + offset}`);
                extendedSlot.className = 'slot extended';
                extendedSlot.innerHTML = '';
                extendedSlot.removeAttribute('data-type');
                extendedSlot.setAttribute('data-extended-from', index);
            }
        }

        function toggleTutorialSlot(index) {
            if (!selectedTutorialKey || isTutorialPlaying) return;

            const mainIndex = getTutorialMainIndex(index);
            if (mainIndex !== null) {
                const currentKey = document.getElementById(`tutorial-slot-${mainIndex}`).getAttribute('data-type');
                if (currentKey === selectedTutorialKey || index !== mainIndex) {
                    clearTutorialGroup(index);
                    return;
                }

                clearTutorialGroup(index);
            }

            if (canPlaceTutorialKey(index, selectedTutorialKey)) {
                fillTutorialSlot(index);
            } else {
                if (mainIndex !== null && canPlaceTutorialKey(mainIndex, selectedTutorialKey)) {
                    fillTutorialSlot(mainIndex);
                }
            }
        }

        function triggerTutorialSlot(index, msPerBeat) {
            const slot = document.getElementById(`tutorial-slot-${index}`);
            slot.classList.add('active');
            playClickSound();

            if (playbackToggle.checked) {
                const type = slot.getAttribute('data-type');
                playFigurationSound(type, () => isTutorialPlaying, msPerBeat);
            }
        }

        function startTutorialPlayback() {
            warmUpAudio();
            isTutorialPlaying = true;
            btnTutorialPlay.textContent = 'Stop';
            btnTutorialPlay.classList.add('playing');

            const bpm = parseInt(bpmInput.value);
            const msPerBeat = (60 / bpm) * 1000;
            let countdownCount = 1;
            const firstTutorialSlot = document.getElementById('tutorial-slot-0');

            firstTutorialSlot.classList.add('countdown-focus');
            tutorialCountdownText.textContent = countdownCount;
            tutorialCountdownOverlay.classList.add('show');
            playClickSound();

            function doTutorialCountdown() {
                countdownCount++;
                if (countdownCount <= 4) {
                    tutorialCountdownText.textContent = countdownCount;
                    playClickSound();
                    countdownTimeout = setTimeout(doTutorialCountdown, msPerBeat);
                } else {
                    tutorialCountdownOverlay.classList.remove('show');
                    firstTutorialSlot.classList.remove('countdown-focus');
                    runTutorialMetronome(msPerBeat);
                }
            }

            countdownTimeout = setTimeout(doTutorialCountdown, msPerBeat);
        }

        function runTutorialMetronome(msPerBeat) {
            let currentSlot = 0;
            triggerTutorialSlot(currentSlot, msPerBeat);

            tutorialPlaybackInterval = setInterval(() => {
                document.getElementById(`tutorial-slot-${currentSlot}`).classList.remove('active');
                currentSlot++;

                if (currentSlot >= 8) {
                    currentSlot = 0;
                }

                if (isTutorialPlaying) {
                    triggerTutorialSlot(currentSlot, msPerBeat);
                }
            }, msPerBeat);
        }

        function stopTutorialPlayback() {
            isTutorialPlaying = false;
            clearInterval(tutorialPlaybackInterval);
            clearTimeout(countdownTimeout);
            tutorialPlaybackInterval = null;
            countdownTimeout = null;
            tutorialCountdownOverlay.classList.remove('show');
            btnTutorialPlay.textContent = 'Play';
            btnTutorialPlay.classList.remove('playing');

            for (let i = 0; i < 8; i++) {
                const slot = document.getElementById(`tutorial-slot-${i}`);
                if (slot) slot.classList.remove('active', 'countdown-focus');
            }
        }

        document.addEventListener('click', hideSlotMenu);
        document.addEventListener('click', hideAppMenu);
        btnAppMenu.addEventListener('click', (event) => {
            appMenu.classList.toggle('show');
            event.stopPropagation();
        });
        appMenu.addEventListener('click', (event) => event.stopPropagation());
        btnOpenMetronome.addEventListener('click', openMetronomeMode);
        btnBackMetronome.addEventListener('click', showMainMode);
        btnMetronomePlay.addEventListener('click', () => {
            if (isMetronomePlaying) { stopMetronomeMode(); } else { startMetronomeMode(); }
        });
        metronomeBpmRange.addEventListener('input', () => setMetronomeBpm(metronomeBpmRange.value));
        btnMetroMinus.addEventListener('click', () => setMetronomeBpm(metronomeBpm - 1));
        btnMetroPlus.addEventListener('click', () => setMetronomeBpm(metronomeBpm + 1));
        readingSoundSelect.addEventListener('change', () => {
            readingSoundTarget = readingSoundSelect.value;
        });
        slotMenu.addEventListener('click', (event) => event.stopPropagation());
        btnOpenTutorial.addEventListener('click', () => openTutorial(selectedTutorialKey));
        btnBackTutorial.addEventListener('click', closeTutorial);
        btnTutorialPlay.addEventListener('click', () => {
            if (isTutorialPlaying) { stopTutorialPlayback(); } else { startTutorialPlayback(); }
        });

        function startPlayback() {
    warmUpAudio();
    isPlaying = true;
    const bpm = parseInt(bpmInput.value);
    const msPerBeat = (60 / bpm) * 1000;
    let countdownCount = 1; 
    
    // ... (manteniamo le logiche di blocco interfaccia che avevi)
    btnPlay.textContent = "Stop";
    btnPlay.classList.add('playing');
    
    // Evidenziamo il primo slot
    const firstSlot = document.getElementById('slot-0');
    firstSlot.classList.add('countdown-focus');

    countdownText.textContent = countdownCount;
    countdownOverlay.classList.add('show');
    playClickSound();
    
    function doCountdown() {
        countdownCount++;
        if (countdownCount <= 4) {
            countdownText.textContent = countdownCount;
            playClickSound();
            countdownTimeout = setTimeout(doCountdown, msPerBeat);
        } else {
            countdownOverlay.classList.remove('show');
            // Rimuoviamo il focus prima di iniziare
            firstSlot.classList.remove('countdown-focus');
            runMetronome(msPerBeat);
        }
    }
    countdownTimeout = setTimeout(doCountdown, msPerBeat);
}

        function triggerSlotFunctions(index, msPerBeat) {
    const slot = document.getElementById(`slot-${index}`);
    slot.classList.add('active');
    
    // Suono metronomo standard
    playClickSound();
    if (playbackToggle.checked) {
        const type = slot.getAttribute('data-type');
        playFigurationSound(type, () => isPlaying, msPerBeat);
    }
}

        function runMetronome(msPerBeat) {
            let currentSlot = 0;
            triggerSlotFunctions(currentSlot, msPerBeat);

            playbackInterval = setInterval(() => {const autoRandomToggle = document.getElementById('autoRandomToggle');

if (autoRandomToggle && autoRandomToggle.checked) {
    // 1. Quando la lettura arriva allo slot 12 (che corrisponde al tuo "13")
    // Randomizziamo gli slot da 0 a 11 (che corrispondono ai tuoi "1 a 12")
    if (currentSlot === 12) {
        randomizeRange(0, 12);
    }

    // 2. Quando la lettura torna allo slot 0 (inizio nuovo giro)
    // Randomizziamo gli slot da 12 a 15 (che corrispondono ai tuoi "13 a 16")
    if (currentSlot === 0) {
        randomizeRange(12, 16);
    }
}
                document.getElementById(`slot-${currentSlot}`).classList.remove('active');
                currentSlot++;
                
                if (currentSlot < 16) {
                    triggerSlotFunctions(currentSlot, msPerBeat);
                } else {
                    clearInterval(playbackInterval);
                    if (isPlaying) {
                        runMetronome(msPerBeat);
                    }
                }
            }, msPerBeat);
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(playbackInterval);
            clearTimeout(countdownTimeout);
            playbackInterval = null;
            countdownTimeout = null;
            
            countdownOverlay.classList.remove('show');
            btnPlay.textContent = "Play";
            btnPlay.classList.remove('playing');
            btnRandomize.disabled = false;
            difficultySelect.disabled = false;
            bpmInput.disabled = false;
            
            for (let i = 0; i < 16; i++) {
                document.getElementById(`slot-${i}`).classList.remove('active');
            }
        }

        btnRandomize.addEventListener('click', randomizeGrid);
        btnPlay.addEventListener('click', () => {
            if (isPlaying) { stopPlayback(); } else { startPlayback(); }
        });

        initGrid();
        initTutorialGrid();
        randomizeGrid();
    </script>
</body>
</html>
